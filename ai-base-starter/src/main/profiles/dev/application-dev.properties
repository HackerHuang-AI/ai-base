server.port=8070
app.environment=dev
app.debug=true

# ==================== 日志配置 ====================
logging.file.path=logs
logging.level.root=INFO
logging.level.com.ai.base=DEBUG

# ==================== Nacos 配置中心 ====================
# 部署平台在启动前注入 Nacos 凭据；未注入时使用本地 dev 账号，便于本地调试。
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.config.namespace=dev
spring.cloud.nacos.config.username=${SPRING_CLOUD_NACOS_CONFIG_USERNAME:ai-base-dev}
spring.cloud.nacos.config.password=${SPRING_CLOUD_NACOS_CONFIG_PASSWORD:ai-base-nacos-local123-dev}
spring.cloud.nacos.config.import-check.enabled=false

# ==================== Nacos 服务注册与发现 ====================
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.namespace=${spring.cloud.nacos.config.namespace}
spring.cloud.nacos.discovery.username=${SPRING_CLOUD_NACOS_DISCOVERY_USERNAME:ai-base-dev}
spring.cloud.nacos.discovery.password=${SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD:ai-base-nacos-local123-dev}

# ==================== Dubbo ====================
dubbo.registry.address=nacos://${spring.cloud.nacos.discovery.server-addr}
# Spring Cloud Nacos 承担应用配置；未使用 Dubbo Config Center，避免读取其默认公共 DataId。
dubbo.config-center.enabled=false
# 元数据中心在当前环境共享：ai-admin 存储服务定义，mapping 存储接口到应用的映射。
dubbo.metadata-report.address=nacos://${spring.cloud.nacos.config.server-addr}
dubbo.metadata-report.group=ai-admin
dubbo.metadata-report.parameters.namespace=${spring.cloud.nacos.config.namespace}
# Dubbo 与 Nacos 共用启动前注入、并由 Vault 保存的应用凭据。
dubbo.registry.username=${spring.cloud.nacos.discovery.username}
dubbo.registry.password=${spring.cloud.nacos.discovery.password}
dubbo.metadata-report.username=${spring.cloud.nacos.config.username}
dubbo.metadata-report.password=${spring.cloud.nacos.config.password}

# ==================== Vault ====================
# dev 仍走 Vault 注入凭据；AppRole 凭据对直接写为默认值，无需再 source env 文件。
spring.config.import=optional:nacos:ai-base.properties?group=ai-base,optional:vault://
spring.cloud.vault.enabled=true
spring.cloud.vault.host=127.0.0.1
spring.cloud.vault.port=8200
spring.cloud.vault.scheme=http
spring.cloud.vault.authentication=APPROLE
spring.cloud.vault.app-role.role-id=${VAULT_ROLE_ID:fd80b1c5-8a70-b45a-a310-a094d6f0e51a}
spring.cloud.vault.app-role.secret-id=${VAULT_SECRET_ID:58b80ab3-6317-89fb-3047-785f58dc9790}
spring.cloud.vault.app-role.app-role-path=approle
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=
spring.cloud.vault.kv.application-name=${spring.application.name}/${spring.profiles.active}
spring.cloud.vault.kv.profiles=

# ==================== Redis（密码由 Vault 注入，本地 ACL 见 start.sh）====================
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.cache.redis.key-prefix=ai-admin:ai-base:
spring.cache.redis.use-key-prefix=true

# ==================== MySQL（凭据由 Vault 注入）====================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ai_base?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

