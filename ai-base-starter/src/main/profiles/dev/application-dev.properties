# HTTP 服务端口
server.port=8070

# ==================== 日志配置 ====================
# 日志文件输出目录
logging.file.path=logs
# 根日志级别
logging.level.root=INFO
# 本服务日志级别
logging.level.com.ai.base=DEBUG

# ==================== Nacos ====================
# Nacos 配置中心地址
spring.cloud.nacos.config.server-addr=127.0.0.1:8848
# Nacos 服务注册与发现地址
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848

# ==================== Redis ====================
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=redis123
spring.data.redis.database=0

# ==================== 数据库 ====================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ai_base?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== Dubbo（本地关闭注册）====================
# 本地开发不向 Nacos 注册 Dubbo 服务
spring.dubbo.registry.register=false

