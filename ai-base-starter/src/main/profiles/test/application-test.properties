# HTTP 服务端口
server.port=8070

# ==================== 日志配置 ====================
# 日志文件输出目录
logging.file.path=logs
# 根日志级别
logging.level.root=INFO

# ==================== Nacos ====================
# Nacos 配置中心地址
spring.cloud.nacos.config.server-addr=127.0.0.1:8848
# Nacos 服务注册与发现地址
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848

# ==================== Vault（本地 AppRole + 静态密钥）====================
# 先启动 ai-fabric 的 Local secrets；角色凭证由其 data/init/ai-base-vault.env 生成。
# 启动阶段导入 Vault 配置。
spring.config.import=optional:nacos:ai-base.properties,optional:vault://
# 启用 Vault 配置中心。
spring.cloud.vault.enabled=true
# Vault 服务地址。
spring.cloud.vault.host=127.0.0.1
spring.cloud.vault.port=8200
spring.cloud.vault.scheme=http
# 使用 AppRole 认证方式。
spring.cloud.vault.authentication=APPROLE
# Local 默认凭据仅用于本地开发；实际投产必须由运行环境注入 VAULT_ROLE_ID 和 VAULT_SECRET_ID，禁止保留明文。
spring.cloud.vault.app-role.role-id=${VAULT_ROLE_ID:f9d3c21b-e022-f367-c7fd-10336d81487d}
spring.cloud.vault.app-role.secret-id=${VAULT_SECRET_ID:3821254f-45ba-40a3-15fc-d115bb1444a4}
# AppRole 认证挂载路径。
spring.cloud.vault.app-role.app-role-path=approle
# KV v2 路径规则：secret/<service>/<profile>。
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=
spring.cloud.vault.kv.application-name=${spring.application.name}/${spring.profiles.active}
spring.cloud.vault.kv.profiles=

# ==================== 数据库（经 HAProxy 统一入口）====================
spring.datasource.url=jdbc:mysql://127.0.0.1:6033/ai_base?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

