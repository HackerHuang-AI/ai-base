# 应用名称，同时作为服务注册到 Nacos 的服务名
spring.application.name=ai-base

# 所有接口的 URL 前缀，例如 /ai-base/xxx
server.servlet.context-path=/ai-base

# 激活的环境配置（dev/test/stag/prod）
# 由 Maven profile 在打包时注入，对应 src/main/profiles/{env}/application-{env}.properties
spring.profiles.active=@spring.profiles.active@

# 配置导入：Nacos 中的本服务业务动态配置
spring.config.import=optional:nacos:ai-base.properties

# ==================== Nacos 配置中心 ====================
# 是否启用 Nacos 配置中心
spring.cloud.nacos.config.enabled=true
# 关闭 spring.config.import 强制校验，允许各环境自行提供 Nacos 地址
spring.cloud.nacos.config.import-check.enabled=false
# Nacos 配置所属分组
spring.cloud.nacos.config.group=${spring.application.name}
# Nacos 配置文件格式
spring.cloud.nacos.config.file-extension=properties

# ==================== Nacos 服务注册与发现 ====================
# 是否开启服务注册与发现
spring.cloud.nacos.discovery.enabled=true
# 注册到 Nacos 的服务名，其他微服务通过此名称发现本服务
spring.cloud.nacos.discovery.service=${spring.application.name}
# 服务注册所属分组
spring.cloud.nacos.discovery.group=${spring.application.name}

# ==================== i18n 国际化 ====================
# 国际化资源文件路径，对应 i18n/messages_xx.properties
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
# 找不到对应语言时不回退到系统语言
spring.messages.fallback-to-system-locale=false

# ==================== Dubbo ====================
# 应用名称，与 spring.application.name 保持一致
dubbo.application.name=${spring.application.name}
# 使用 Triple 协议，基于 HTTP/2 且兼容 gRPC
dubbo.protocol.name=tri
# Dubbo Triple 协议端口，与 HTTP server.port 独立
dubbo.protocol.port=20880
# 注册中心：使用各环境文件配置的 Nacos 地址
dubbo.registry.address=nacos://${spring.cloud.nacos.discovery.server-addr}
dubbo.registry.username=${spring.cloud.nacos.discovery.username:}
dubbo.registry.password=${spring.cloud.nacos.discovery.password:}
# 配置中心：使用各环境文件配置的 Nacos 地址
dubbo.config-center.address=nacos://${spring.cloud.nacos.config.server-addr}
dubbo.config-center.username=${spring.cloud.nacos.config.username:}
dubbo.config-center.password=${spring.cloud.nacos.config.password:}
# Dubbo Provider 接口扫描包路径
dubbo.scan.base-packages=com.ai.base

